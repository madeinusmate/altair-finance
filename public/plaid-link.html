<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Connect your bank</title>
  </head>
  <body>
    <p>Connecting to your bank…</p>
    <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.hash.replace(/^#/, ""));
        var token = params.get("token");
        var finish = function (search) {
          var next = new URL("/accounts/connect", window.location.origin);
          search.forEach(function (value, key) {
            next.searchParams.set(key, value);
          });
          window.location.replace(next.toString());
        };

        if (!token || typeof Plaid === "undefined") {
          finish(new URLSearchParams("plaid_exit=1&plaid_error=missing_token"));
          return;
        }

        var handler = Plaid.create({
          token: token,
          onSuccess: function (publicToken) {
            var search = new URLSearchParams();
            search.set("plaid_public_token", publicToken);
            finish(search);
          },
          onExit: function (err) {
            var search = new URLSearchParams();
            search.set("plaid_exit", "1");
            if (err && err.error_code) search.set("plaid_error", err.error_code);
            if (err && err.error_message) search.set("plaid_error_message", err.error_message);
            finish(search);
          },
        });
        handler.open();
      })();
    </script>
  </body>
</html>
